name: Package upstream release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: package-upstream-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      upstream_version: ${{ steps.upstream.outputs.upstream_version }}
      version: ${{ steps.upstream.outputs.version }}
      release_tag: ${{ steps.upstream.outputs.release_tag }}
      should_build: ${{ steps.upstream.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api repos/bambulab/BambuStudio/releases/latest)"
          tag="$(jq -r .tag_name <<<"$release")"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){3}$ ]]
          IFS=. read -r major minor patch build <<<"${tag#v}"
          upstream_version="$((10#$major)).$((10#$minor)).$((10#$patch)).$((10#$build))"
          jq -e '
            [.assets[] | select(.name | test("^BambuStudio_ubu22[-_].*\\.AppImage$"))]
            | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))
          ' <<<"$release" >/dev/null

          prefix="bambu-studio-${upstream_version}-"
          latest_revision=0
          latest_tag=""
          while IFS= read -r candidate; do
            revision=${candidate#"$prefix"}
            if [[ "$candidate" == "$prefix"* && "$revision" =~ ^[1-9][0-9]*$ ]] && (( revision > latest_revision )); then
              latest_revision=$revision
              latest_tag=$candidate
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')

          if (( latest_revision == 0 )); then
            revision=1
            should_build=true
          else
            git fetch --tags --force
            if git diff --quiet "$latest_tag"..HEAD -- debian/control package.sh .github/workflows/package.yml; then
              revision=$latest_revision
              should_build=false
            else
              revision=$((latest_revision + 1))
              should_build=true
            fi
          fi

          version="${upstream_version}-${revision}"
          release_tag="bambu-studio-${version}"
          {
            echo "tag=$tag"
            echo "upstream_version=$upstream_version"
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build Debian package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_VERSION: ${{ needs.resolve.outputs.upstream_version }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash ./package.sh "$TAG" "$UPSTREAM_VERSION" "$VERSION" amd64

      - uses: actions/upload-artifact@v7
        with:
          name: deb-amd64
          path: dist/*.deb
          if-no-files-found: error

  validate:
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: deb-amd64
          path: dist

      - name: Validate installed package
        env:
          TEST_IMAGE: ${{ matrix.image }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -e TAG "$TEST_IMAGE" bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends /dist/*.deb desktop-file-utils
            test "$(command -v bambu-studio)" = /usr/bin/bambu-studio
            test -s /usr/share/doc/bambu-studio/LICENSE
            test -s /usr/share/doc/bambu-studio/copyright
            desktop-file-validate /usr/share/applications/BambuStudio.desktop
            useradd -m -s /bin/bash coplo-test
            runuser -u coplo-test -- bambu-studio --help > /tmp/help.txt
            grep -F "BambuStudio-${TAG#v}" /tmp/help.txt
            LD_LIBRARY_PATH=/usr/lib/bambu-studio/bin ldd /usr/lib/bambu-studio/bin/bambu-studio > /tmp/ldd.txt
            if grep -F "not found" /tmp/ldd.txt; then exit 1; fi
          '

  publish:
    needs: [resolve, build, validate]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: deb-amd64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Repackaged official Ubuntu 22.04 AppImage with SHA-256 verification. Upstream source: https://github.com/bambulab/BambuStudio/tree/$TAG"
